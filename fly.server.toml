app = "uangku-api"
primary_region = "sin"

[build]
  dockerfile = "server/Dockerfile"

[env]
  APP_ENV = "production"
  HTTPS_ONLY = "true"
  WEB_CONCURRENCY = "2"
  PORT = "8000"

[deploy]
  release_command = "uv run alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/health"
