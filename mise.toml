[tools]
node = "24"
python = "3.13"

[env]
APP_ENV = "development"

[tasks."dev:client"]
dir = "client"
run = "npm run dev"

[tasks."dev:server"]
dir = "server"
run = "uv run uvicorn app.main:app --reload --port 8000"

[tasks.dev]
run = [{ tasks = ["dev:client", "dev:server"] }]

[tasks."test:server"]
dir = "server"
run = "uv run pytest"

[tasks."test:client"]
dir = "client"
run = "npm test"

[tasks.test]
depends = ["test:server", "test:client"]

[tasks."lint:client"]
dir = "client"
run = "npm run lint"

[tasks."lint:server"]
dir = "server"
run = "uv run ruff check ."

[tasks.lint]
run = [{ tasks = ["lint:client", "lint:server"] }]

[tasks."build:client"]
dir = "client"
run = "npm run build"

[tasks.build]
run = [{ task = "build:client" }]

[tasks."test:e2e"]
description = "Run Playwright E2E tests (requires dev server running)"
dir = "client"
run = "npx playwright test"