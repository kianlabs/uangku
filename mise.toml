[tools]
node = "24"
python = "3.13"

[env]
APP_ENV = "development"

[tasks."dev:frontend"]
dir = "frontend"
run = "npm run dev"

[tasks."dev:backend"]
dir = "backend"
run = "uv run uvicorn app.main:app --reload --port 8000"

[tasks.dev]
run = [{ tasks = ["dev:frontend", "dev:backend"] }]

[tasks."test:backend"]
dir = "backend"
run = "uv run pytest"

[tasks."test:frontend"]
dir = "frontend"
run = "npm test"

[tasks.test]
run = [{ tasks = ["test:backend", "test:frontend"] }]

[tasks."lint:frontend"]
dir = "frontend"
run = "npm run lint"

[tasks."lint:backend"]
dir = "backend"
run = "uv run ruff check ."

[tasks.lint]
run = [{ tasks = ["lint:frontend", "lint:backend"] }]

[tasks."build:frontend"]
dir = "frontend"
run = "npm run build"

[tasks.build]
run = [{ task = "build:frontend" }]

[tasks."test:e2e"]
description = "Run Playwright E2E tests (requires dev server running)"
dir = "frontend"
run = "npx playwright test"

[tasks.orchestra]
description = "Herdr parallel agent dispatcher (up/next/status/wait/collect/prompt/down)"
run = "bash scripts/orchestra.sh"