app = "uangku-web"
primary_region = "sin"

[build]
  dockerfile = "client/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SERVER_URL = "http://uangku-api.internal:8000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
