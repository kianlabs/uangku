[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.2.0",
    "fastapi==0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.53.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in function defaults is intentional
